# 로컬 실행용.
# - 프론트·전체 실행: docker compose up -d --build  → http://localhost:8080
# - 백엔드 개발(bootRun): docker compose up -d postgres  → DB만 띄우고 앱은 ./gradlew bootRun
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sonulim}
      POSTGRES_USER: ${DB_USERNAME:-sonulim}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sonulim}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - sonulim-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sonulim} -d ${DB_NAME:-sonulim}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: sonulim-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      # local 설정의 localhost 대신 postgres 컨테이너로 접속한다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-sonulim}
      DB_USERNAME: ${DB_USERNAME:-sonulim}
      DB_PASSWORD: ${DB_PASSWORD:-sonulim}
      # 비어 있으면 로컬 개발용 키를 쓴다(32바이트 이상).
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-do-not-use-in-prod-0123456789}
      # FCM 실제 발송(선택): secret/ 폴더에 서비스 계정 키를 두고 .env에 FIREBASE_KEY_FILE=<파일 이름>을 넣는다.
      # 비워 두면 푸시는 보내지 않고 서버 로그로만 남는다.
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_KEY_FILE:+/app/secret/}${FIREBASE_KEY_FILE:-}
    volumes:
      - ./secret:/app/secret:ro
    ports:
      - "${APP_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sonulim-postgres-data:
