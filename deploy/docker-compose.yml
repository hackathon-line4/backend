# 서버(EC2 1대)용 구성: 앱 + Postgres + Caddy(HTTPS). 로컬 개발용 DB는 레포 최상위 docker-compose.yml을 쓴다.
# 실행: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# 순서·설명은 docs/deploy.md

name: sonulim

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sonulim}
      POSTGRES_USER: ${DB_USERNAME:-sonulim}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?deploy/.env에 DB_PASSWORD를 넣어 주세요}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sonulim} -d ${DB_NAME:-sonulim}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: sonulim-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # PushSender 운영 구현 전까지는 local 설정으로 띄운다(푸시는 로그로만 남음). 구현 후 prod로 바꾼다.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # local·prod 설정 모두 이 값으로 DB 주소를 덮어쓴다(local 설정의 localhost 대신 db 컨테이너).
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-sonulim}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-sonulim}
      DB_USERNAME: ${DB_USERNAME:-sonulim}
      DB_PASSWORD: ${DB_PASSWORD:?deploy/.env에 DB_PASSWORD를 넣어 주세요}
      JWT_SECRET: ${JWT_SECRET:?deploy/.env에 32바이트 이상 JWT_SECRET을 넣어 주세요}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    expose:
      - "8080"
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?deploy/.env에 DOMAIN을 넣어 주세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *default-logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
