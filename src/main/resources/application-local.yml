spring:
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:sonulim}
    username: ${DB_USERNAME:sonulim}
    password: ${DB_PASSWORD:sonulim}
  jpa:
    hibernate:
      # 임시: Flyway 마이그레이션 도입 전까지만 사용. 전환 시 validate로 바꾸고 마이그레이션 스크립트로 대체한다.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

sonulim:
  jwt:
    # 로컬 개발 전용 기본 키(HS256 최소 32바이트). 운영은 환경 변수 JWT_SECRET으로만 주입한다.
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-do-not-use-in-prod-0123456789}
