spring:
  application:
    name: sonulim-be
  profiles:
    default: local
  jpa:
    open-in-view: false

server:
  port: 8080

sonulim:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:3600}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:2592000}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
