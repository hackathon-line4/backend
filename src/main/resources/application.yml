spring:
  application:
    name: sonulim-be
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # 서버 시각은 UTC로 저장한다(공통 규칙). JVM 기본 시간대 고정(SonulimApplication)과 함께 둔다.
        jdbc:
          time_zone: UTC

server:
  port: 8080

sonulim:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:3600}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:2592000}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  location:
    # 시간이 지난 요청을 훑는 주기(ms). 요청 제한 시간(30초 제안)은 요청을 만들 때 정해지므로
    # 생성 API가 들어올 때 설정으로 추가한다.
    timeout-sweep-interval-ms: 5000
  idempotency:
    # 공통 규칙에 24시간으로 확정되어 있다.
    retention: 24h
    # 기한이 지난 기록을 지우는 주기(ms). 기본 1시간.
    cleanup-interval-ms: 3600000
  messaging:
    # 긴급 신호 전달 후 이만큼 무응답이면 보호자에게 경고. 백엔드 제안값이고 기획 확정 전이다
    # (docs/domains/messaging.md의 Pending Decisions).
    emergency-warning-delay: 30s
    # 보호자가 고른 값(5/10/30분)을 써야 하지만 settings 도메인 구현 전까지 이 기본값을 쓴다.
    default-response-wait-minutes: 10
    # 긴급 신호를 받은 기기가 따를 재생 정책. 기능 명세서 제안표 그대로이고 기획 확정 전이다.
    emergency-playback:
      repeat-interval-sec: 10
      max-duration-sec: 60
      bypass-dnd: true
    # 기한이 지난 기록을 훑는 주기(ms) = 판정이 늦어질 수 있는 최대 시간.
    timer-sweep-interval-ms: 5000
